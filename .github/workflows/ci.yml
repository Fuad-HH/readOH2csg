name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'release/*']
  push:
    branches: [main, 'release/*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pre-commit (ruff, clang-format, cmake-format, ...)
        run: pip install pre-commit && pre-commit run --all-files --show-diff-on-failure
      - name: Kokkos spaces guard
        # allocate with Omega_h::Write and launch with Omega_h::parallel_for /
        # Omega_h::policy so code runs in Omega_h's memory/execution spaces
        run: |
          ! grep -rnE 'Kokkos::View<|Kokkos::parallel_for' src/omegah2csg apps bindings \
              --include='*.cpp' --include='*.hpp' | grep -v 'transfer.hpp'

  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        python-version: ['3.11', '3.13']
    name: "Python ${{ matrix.python-version }} - ${{ matrix.build_type }}"
    steps:
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pinned versions
        run: cat ci/versions.env >> "$GITHUB_ENV"
      - name: Apt dependencies
        run: |
          sudo apt -y update
          sudo apt install -y gcc g++ pkg-config libnetcdf-dev libpugixml-dev

      - name: build kokkos
        uses: ./.github/actions/install-repo
        with:
          repo-name: kokkos
          repo-path: kokkos/kokkos
          repo-ref: ${{ env.KOKKOS_VERSION }}
          cache: true
          options: '-DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON
                    -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON
                    -DKokkos_ENABLE_DEBUG_BOUNDS_CHECK=${{ matrix.build_type == ''Debug'' && ''ON'' || ''OFF'' }}'

      - name: build omega_h
        uses: ./.github/actions/install-repo
        with:
          repo-name: omega_h
          repo-path: SCOREC/omega_h
          repo-ref: ${{ env.OMEGA_H_SHA }}
          cache: true
          options: '-DBUILD_SHARED_LIBS=ON -DOmega_h_USE_MPI=OFF
                    -DOmega_h_USE_Kokkos=ON -DBUILD_TESTING=OFF
                    -DKokkos_ROOT=${{ runner.temp }}/build-kokkos/install'

      - name: Install omegah2csg
        run: |
          pip install -c ci/constraints.txt scikit-build-core pybind11 numpy pytest netCDF4
          pip install --extra-index-url https://shimwell.github.io/wheels openmc
          export CMAKE_PREFIX_PATH="${{ runner.temp }}/build-omega_h/install:${{ runner.temp }}/build-kokkos/install"
          pip install -e .[test] --no-build-isolation \
            -Ccmake.build-type=${{ matrix.build_type }} \
            -Ccmake.define.OMEGAH2CSG_ENABLE_TESTS=ON

      - name: Tests (1 and 4 threads)
        run: |
          export OMP_PROC_BIND=spread OMP_PLACES=threads
          OMP_NUM_THREADS=1 pytest
          OMP_NUM_THREADS=4 pytest

  cuda-compile:
    # no GPU on hosted runners: compile only, catching host/device mistakes
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pinned versions
        run: cat ci/versions.env >> "$GITHUB_ENV"
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y git g++ pkg-config libnetcdf-dev libpugixml-dev python3-pip
          pip3 install cmake==3.31.6
      - name: build kokkos (CUDA)
        uses: ./.github/actions/install-repo
        with:
          repo-name: kokkos-cuda
          repo-path: kokkos/kokkos
          repo-ref: ${{ env.KOKKOS_VERSION }}
          cache: true
          options: '-DCMAKE_CXX_STANDARD=17 -DBUILD_SHARED_LIBS=ON
                    -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_CUDA=ON
                    -DKokkos_ENABLE_CUDA_LAMBDA=ON -DKokkos_ARCH_AMPERE80=ON'
      - name: build omega_h (CUDA)
        uses: ./.github/actions/install-repo
        with:
          repo-name: omega_h-cuda
          repo-path: SCOREC/omega_h
          repo-ref: ${{ env.OMEGA_H_SHA }}
          cache: true
          options: '-DBUILD_SHARED_LIBS=ON -DOmega_h_USE_MPI=OFF
                    -DOmega_h_USE_Kokkos=ON -DBUILD_TESTING=OFF
                    -DKokkos_ROOT=${{ runner.temp }}/build-kokkos-cuda/install'
      - name: build omegah2csg (CUDA)
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/build-omega_h-cuda/install;${{ runner.temp }}/build-kokkos-cuda/install" \
            -DOMEGAH2CSG_ENABLE_PYTHON=OFF -DOMEGAH2CSG_ENABLE_BENCH=ON
          cmake --build build -j4
