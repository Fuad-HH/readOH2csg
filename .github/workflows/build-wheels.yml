name: Build Manylinux Wheels

# Stage A wheels: libomega_h, Kokkos (Serial+OpenMP) and netcdf-c (no HDF5)
# are built once and bundled by auditwheel; the wheel ships omegah2csg._core
# and the native executables (omegah2csg/bin). No PyOmega_h.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - CMakeLists.txt
      - pyproject.toml
      - 'cmake/**'
      - 'src/**'
      - 'apps/**'
      - 'bindings/**'
      - 'python/**'
      - '.github/**'
      - 'ci/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Pinned versions
        run: cat ci/versions.env >> "$GITHUB_ENV"
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y gcc gcc-c++ make git m4 zlib-devel pkgconfig &&
            curl -sSL https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
            | tar -xz -C /usr/local --strip-components=1 &&
            D=/usr/local/deps && mkdir -p $D &&
            git clone --depth 1 --branch ${{ env.KOKKOS_VERSION }} https://github.com/kokkos/kokkos.git /tmp/kokkos &&
            cmake -S /tmp/kokkos -B /tmp/kokkos-b -DCMAKE_INSTALL_PREFIX=$D -DCMAKE_CXX_STANDARD=17
            -DBUILD_SHARED_LIBS=ON -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON &&
            cmake --build /tmp/kokkos-b -j$(nproc) --target install &&
            git clone https://github.com/SCOREC/omega_h.git /tmp/omega_h &&
            git -C /tmp/omega_h checkout ${{ env.OMEGA_H_SHA }} &&
            cmake -S /tmp/omega_h -B /tmp/omega_h-b -DCMAKE_INSTALL_PREFIX=$D -DBUILD_SHARED_LIBS=ON
            -DOmega_h_USE_MPI=OFF -DOmega_h_USE_Kokkos=ON -DOmega_h_USE_ZLIB=ON -DBUILD_TESTING=OFF
            -DKokkos_ROOT=$D &&
            cmake --build /tmp/omega_h-b -j$(nproc) --target install &&
            git clone --depth 1 --branch ${{ env.NETCDF_C_VERSION }} https://github.com/Unidata/netcdf-c.git /tmp/netcdf &&
            cmake -S /tmp/netcdf -B /tmp/netcdf-b -DCMAKE_INSTALL_PREFIX=$D -DNETCDF_ENABLE_NETCDF4=OFF
            -DNETCDF_ENABLE_HDF5=OFF -DNETCDF_ENABLE_DAP=OFF -DNETCDF_ENABLE_BYTERANGE=OFF
            -DNETCDF_ENABLE_NCZARR=OFF -DNETCDF_BUILD_UTILITIES=OFF -DNETCDF_ENABLE_TESTS=OFF &&
            cmake --build /tmp/netcdf-b -j$(nproc) --target install &&
            git clone --depth 1 --branch ${{ env.PUGIXML_VERSION }} https://github.com/zeux/pugixml.git /tmp/pugixml &&
            cmake -S /tmp/pugixml -B /tmp/pugixml-b -DCMAKE_INSTALL_PREFIX=$D -DCMAKE_POSITION_INDEPENDENT_CODE=ON &&
            cmake --build /tmp/pugixml-b -j$(nproc) --target install
          CIBW_ENVIRONMENT_LINUX: >
            LD_LIBRARY_PATH=/usr/local/deps/lib:/usr/local/deps/lib64:$LD_LIBRARY_PATH
            CMAKE_PREFIX_PATH=/usr/local/deps
            PKG_CONFIG_PATH=/usr/local/deps/lib/pkgconfig:/usr/local/deps/lib64/pkgconfig
            PIP_CONSTRAINT=ci/constraints.txt
          CIBW_TEST_EXTRAS: test
          CIBW_TEST_SOURCES: tests
          CIBW_TEST_COMMAND: >
            convert2openmc --version && convert2degas2 --version &&
            pytest tests/python
          # libomega_h and libkokkoscore must appear exactly once
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel} &&
            for w in {dest_dir}/*.whl; do
              n=$(unzip -l "$w" | grep -cE 'libomega_h|libkokkoscore');
              [ "$n" -eq 2 ] || { echo "duplicate omega_h/kokkos libs in $w"; exit 1; };
            done
      - uses: actions/upload-artifact@v4
        with:
          name: manylinux-wheels
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
