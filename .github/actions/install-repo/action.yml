name: Install-Repo

inputs:
  repo-name:
    required: true
  repo-path:
    required: true
  repo-ref:
    required: true # tag or commit sha
  options:
    required: true
  cache:
    required: true

runs:
  using: "composite"
  steps:
    - name: Hash build options
      id: opts
      shell: bash
      run: echo "hash=$(echo '${{ inputs.options }}' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Check Cache
      if: ${{ inputs.cache == 'true'}}
      uses: actions/cache@v4
      id: check-cache
      with:
        key: build-${{ inputs.repo-name }}-${{ inputs.repo-ref }}-${{ steps.opts.outputs.hash }}-${{ hashFiles('ci/versions.env') }}
        path: ${{ runner.temp }}/build-${{ inputs.repo-name }}

    - name: Checkout Repo
      if: ${{ !steps.check-cache.outputs.cache-hit }}
      uses: actions/checkout@v4
      with:
        repository: ${{inputs.repo-path }}
        ref: ${{ inputs.repo-ref }}
        path: ${{ inputs.repo-name }}

    - name: Configure CMake
      if: ${{ !steps.check-cache.outputs.cache-hit }}
      shell: bash
      run: cmake -S $GITHUB_WORKSPACE/${{ inputs.repo-name }} -B ${{ runner.temp }}/build-${{ inputs.repo-name }}
        -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/build-${{ inputs.repo-name }}/install
        ${{ inputs.options }}

    - name: Build Cmake
      if: ${{ !steps.check-cache.outputs.cache-hit }}
      shell: bash
      run: cmake --build ${{ runner.temp }}/build-${{ inputs.repo-name }} -j8 --target install
