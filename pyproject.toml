[build-system]
# pybind11 must match the version PyOmega_h was built with (ci/constraints.txt)
requires = ["scikit-build-core>=0.11", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "omegah2csg"
authors = [
    { name="Fuad Hasan", email="fuadhhasan.for@gmail.com" },
]
description = "Convert Omega_h tokamak meshes (TOMMS/XGC) to CSG geometry for OpenMC and DEGAS2."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
openmc = ["openmc>=0.15"]
test = ["pytest", "netCDF4>=1.7.2", "openmc>=0.15"]

[project.urls]
Homepage = "https://github.com/Fuad-HH/readOH2csg"
Issues = "https://github.com/Fuad-HH/readOH2csg/issues"

[project.scripts]
convert2openmc = "omegah2csg._cli:openmc_main"
convert2degas2 = "omegah2csg._cli:degas2_main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/omegah2csg"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
metadata.version.regex = "project\\([^)]*?\\bVERSION\\s+(?P<value>[0-9]+\\.[0-9]+\\.[0-9]+)[^)]*\\)"
sdist.include = [
    "CMakeLists.txt",
    "cmake/**",
    "src/**",
    "apps/**",
    "bindings/**",
    "python/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.ruff]
include = ["pyproject.toml", "python/**/*.py", "tests/**/*.py", "bench/**/*.py"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "PT", "NPY", "SIM", "RUF"]
